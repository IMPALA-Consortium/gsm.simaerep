meta:
  Type: Reporting
  ID: Input
  Description: Reporting Input Data
  Priority: 1
spec:
  Mapped_STUDY:
    GroupID:
      type: character
steps:
  # Capture study ID from the GroupID column in the study metadata.
  - output: GroupID
    name: dplyr::pull
    params:
      .data: Mapped_STUDY
      var: GroupID
  - output: strStudyID
    name: unique
    params:
      x: GroupID

  # Stack all analysis input data into a single data frame.

  - output: Reporting_Input
    name: gsm.reporting::BindResults
    params:
      lAnalysis: lAnalyzed
      strName: Analysis_Input
      strStudyID: strStudyID

